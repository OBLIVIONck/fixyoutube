services:
  fixyoutube:
    build: .
    container_name: fixyoutube
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      INNERTUBE_CLIENT_VERSION: "2.20250317.01.00"
    networks:
      - master_web

networks:
  master_web:
    external: true
